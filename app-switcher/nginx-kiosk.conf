# =============================================================================
#  Kiosk App Switcher — nginx config
#  Port 8080 → Home Screens (localhost:3000) with switcher overlay injected
#  Port 8081 → Home Assistant (localhost:8123) with switcher overlay injected
#
#  Tap the upper-right corner (60×60 px) to switch between apps.
# =============================================================================

# ── shared overlay snippet (injected before </body>) ─────────────────────────
# HS side: tap → go to HA on port 8081
# HA side: tap → go to HS on port 8080
# The redirect uses window.location so the kiosk just navigates.

map $server_port $other_app_port {
  8080  8081;
  8081  8080;
}

# ── Home Screens proxy (port 8080) ───────────────────────────────────────────
server {
  listen 8080;
  server_name localhost;

  # allow large WS frames from HS
  proxy_http_version 1.1;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection "upgrade";
  proxy_set_header Host localhost:3000;
  proxy_set_header X-Real-IP $remote_addr;

  # enable sub_filter on compressed responses
  proxy_set_header Accept-Encoding "";
  sub_filter_once on;
  sub_filter_types text/html;
  sub_filter '</body>' '<script>
(function(){
  var d=document.createElement("div");
  d.id="__ks_zone__";
  d.style.cssText="position:fixed;top:0;right:0;width:80px;height:80px;z-index:2147483647;-webkit-tap-highlight-color:transparent;";
  var taps=0,timer=0;
  d.addEventListener("touchstart",function(e){
    taps++;
    clearTimeout(timer);
    if(taps>=2){taps=0;window.location="http://"+window.location.hostname+":8081";}
    else{timer=setTimeout(function(){taps=0;},600);}
    e.preventDefault();
  },{passive:false});
  document.body.appendChild(d);
})();
</script></body>';

  location / {
    proxy_pass http://127.0.0.1:3000;
  }

  # WebSocket upgrade for HS hot-reload / live updates
  location ~* /(ws|socket\.io) {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }
}

# ── Home Assistant proxy (port 8081) ─────────────────────────────────────────
server {
  listen 8081;
  server_name localhost;

  proxy_http_version 1.1;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection "upgrade";
  proxy_set_header Host localhost:8123;
  proxy_set_header X-Real-IP $remote_addr;
  # HA checks this header — tell it the real origin so auth works
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto http;

  proxy_set_header Accept-Encoding "";
  sub_filter_once on;
  sub_filter_types text/html;
  sub_filter '</body>' '<script>
(function(){
  var d=document.createElement("div");
  d.id="__ks_zone__";
  d.style.cssText="position:fixed;top:0;right:0;width:80px;height:80px;z-index:2147483647;-webkit-tap-highlight-color:transparent;";
  var taps=0,timer=0;
  d.addEventListener("touchstart",function(e){
    taps++;
    clearTimeout(timer);
    if(taps>=2){taps=0;window.location="http://"+window.location.hostname+":8080";}
    else{timer=setTimeout(function(){taps=0;},600);}
    e.preventDefault();
  },{passive:false});
  document.body.appendChild(d);
})();
</script></body>';

  location / {
    proxy_pass http://127.0.0.1:8123;
  }

  # WebSocket for HA real-time updates
  location /api/websocket {
    proxy_pass http://127.0.0.1:8123/api/websocket;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 3600;
  }
}
